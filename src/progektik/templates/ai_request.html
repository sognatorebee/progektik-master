<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Запрос к нейросети</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: #fff5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #6b5b62;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            border-radius: 32px;
            padding: 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 45px rgba(255, 182, 193, 0.25);
            border: 1px solid #ffe4e1;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #fce4ec;
        }
        .header h1 {
            font-size: 22px;
            color: #d67a8e;
            font-weight: 700;
        }
        .back-btn {
            background: #fce4ec;
            color: #d67a8e;
            border: none;
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .back-btn:hover { background: #f8bbd0; color: white; }

        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b58e9b;
            font-weight: 700;
            font-size: 14px;
        }
        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #fce4ec;
            border-radius: 16px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
            background-color: #fffbfb;
            color: #6b5b62;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
        }
        textarea:focus {
            border-color: #f8bbd0;
            box-shadow: 0 0 0 4px #fce4ec;
        }
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: #f8bbd0;
            color: #8a5a6b;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn-submit:hover {
            background-color: #f48fb1;
            color: white;
        }

        .response-box {
            margin-top: 25px;
            padding: 20px;
            background: #fffbfb;
            border: 1px solid #fce4ec;
            border-radius: 16px;
            display: none;
        }
        .response-box h3 {
            color: #d67a8e;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .response-box p {
            font-size: 15px;
            line-height: 1.5;
            color: #6b5b62;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Запрос к ИИ</h1>
            <button class="back-btn" onclick="window.location.href='/dashboard'">← Назад</button>
        </div>

        <form id="ai-form">
            <div class="form-group">
                <label for="prompt">Что вы хотите спросить у нейросети?</label>
                <textarea id="prompt" placeholder="Например: Напиши короткий стих про розовый закат..." required></textarea>
            </div>
            <button type="submit" class="btn-submit">Отправить запрос ✨</button>
        </form>

        <div class="response-box" id="response-box">
            <h3>Ответ нейросети:</h3>
            <p id="ai-response"></p>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(document).ready(function() {
            $('#ai-form').on('submit', function(e) {
                e.preventDefault();
                const prompt = $('#prompt').val();
                const responseBox = $('#response-box');
                const responseText = $('#ai-response');
                const submitBtn = $('.btn-submit');

                submitBtn.text('Думаю... ⏳').prop('disabled', true);
                responseBox.show();
                responseText.text('Запрос отправлен. Ожидайте ответа...');

                $.ajax({
                    url: '/ai-request',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ prompt: prompt }),
                    success: function(data) {
                        responseText.text(data.response);
                    },
                    error: function() {
                        responseText.text('Произошла ошибка при отправке запроса.');
                    },
                    complete: function() {
                        submitBtn.text('Отправить запрос ✨').prop('disabled', false);
                    }
                });
            });
        });
    </script>
</body>
</html>
