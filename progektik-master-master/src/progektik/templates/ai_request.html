<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Чат с ИИ</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: #fff5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #6b5b62;
        }
        .chat-container {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 10px 40px rgba(255, 182, 193, 0.2);
            width: 100%;
            max-width: 500px;
            height: 600px;
            display: flex;
            flex-direction: column;
            border: 1px solid #ffe4e1;
            overflow: hidden;
        }
        .chat-header {
            background-color: #fce4ec;
            padding: 20px;
            text-align: center;
            font-weight: 700;
            color: #d67a8e;
            font-size: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .chat-header a {
            font-size: 14px;
            color: #8a5a6b;
            text-decoration: none;
            background: white;
            padding: 8px 12px;
            border-radius: 10px;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            background-color: #fffbfb;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 80%;
            font-size: 15px;
            line-height: 1.4;
        }
        .message.user {
            background-color: #f8bbd0;
            color: #8a5a6b;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.ai {
            background-color: #ffffff;
            border: 1px solid #fce4ec;
            color: #6b5b62;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 20px;
            background: #ffffff;
            border-top: 1px solid #fce4ec;
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 15px;
            border: 2px solid #fce4ec;
            border-radius: 14px;
            font-size: 15px;
            outline: none;
            background-color: #fffbfb;
            color: #6b5b62;
        }
        .chat-input-area input:focus { border-color: #f8bbd0; }
        .chat-input-area button {
            padding: 0 20px;
            background-color: #f8bbd0;
            color: #8a5a6b;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }
        .chat-input-area button:hover { background-color: #f48fb1; color: #ffffff; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            Чат с ИИ (Лама)
            <a href="/profile">← Назад</a>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message ai">Привет! Я локальная нейросеть. Задай мне любой вопрос!</div>
        </div>
        <form class="chat-input-area" id="chat-form">
            <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off" required>
            <button type="submit">Отправить</button>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js"></script>
    <script>
        $(document).ready(function() {
            $('#chat-form').on('submit', function(e) {
                e.preventDefault();
                
                let message = $('#message-input').val().trim();
                if (!message) return;

                let chatBox = $('#chat-box');

                chatBox.append(`<div class="message user">${message}</div>`);
                $('#message-input').val('');
                chatBox.scrollTop(chatBox[0].scrollHeight);

                let loadingMsg = $('<div class="message ai">Печатает...</div>');
                chatBox.append(loadingMsg);
                chatBox.scrollTop(chatBox[0].scrollHeight);

                $.ajax({
                    url: '/api/chat',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ message: message }),
                    success: function(data) {
                        loadingMsg.remove();
                        if (data.reply) {
                            chatBox.append(`<div class="message ai">${data.reply}</div>`);
                        } else if (data.error) {
                            chatBox.append(`<div class="message ai" style="color:red;">Ошибка: ${data.error}</div>`);
                        }
                        chatBox.scrollTop(chatBox[0].scrollHeight);
                    },
                    error: function(xhr) {
                        loadingMsg.remove();
                        let errorMsg = "Ошибка сервера.";
                        if (xhr.responseJSON && xhr.responseJSON.error) {
                            errorMsg = xhr.responseJSON.error;
                        }
                        chatBox.append(`<div class="message ai" style="color:red;">${errorMsg}</div>`);
                        chatBox.scrollTop(chatBox[0].scrollHeight);
                    }
                });
            });
        });
    </script>
</body>
</html>
